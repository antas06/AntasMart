{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in - Antas Mart</title>
    <link rel="stylesheet" href="{% static 'inventory/css/styles.css' %}">
</head>
<body style="min-height:100vh; display:grid; place-items:center; background:#f1f5f9;">
    <main class="card" style="width:min(100% - 2rem, 400px);">
        <h1 class="card-title" style="font-size:1.5rem;">Antas Mart</h1>
        <p style="color:var(--text-muted); margin-top:-.5rem;">Sign in to access the POS and inventory.</p>
        {% if form.errors %}
            <div class="alert alert-error">Your username or password is incorrect.</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label" for="id_username">Username</label>
                <input class="form-control" type="text" name="username" id="id_username" autofocus required>
            </div>
            <div class="form-group">
                <label class="form-label" for="id_password">Password</label>
                <input class="form-control" type="password" name="password" id="id_password" required>
            </div>
            <input type="hidden" name="next" value="{{ next }}">
            <button class="btn btn-primary btn-block" type="submit">Sign in</button>
        </form>
    </main>
</body>
</html>
